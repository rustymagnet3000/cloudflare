version: 2.1


jobs:
  check_tf_formatting:
    docker:
      - image: cimg/deploy:2024.11
   
    steps:
      - checkout
      - run:
          name: echo Terraform version
          command: |
            terraform version

      - run:
          name: Terraform fmt to provoke issues
          command: |
            terraform fmt -check -recursive; test $? -eq 0 

  lint:
    docker:
      - image: cimg/deploy:2024.11
   
    steps:
      - checkout
      - run:
          name: install tflint
          command: |
            curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - run:
          name: tflint
          command: |
            tflint --recursive

workflows:
  format_lint_checks:
    jobs:
    - check_tf_formatting
    - lint
